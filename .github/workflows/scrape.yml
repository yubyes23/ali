name: Clean Aliyun Share Links

on:
  # 支持手动触发
  workflow_dispatch:
  # 支持定时自动运行（例如每天凌晨 4 点运行一次）
  schedule:
    - cron: '0 4 * * *'

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Cleaning Script
        env:
          # 如果需要 Cookie 或 Token，可以通过 GitHub Secrets 传入
          ALIYUN_TOKEN: ${{ secrets.ALIYUN_TOKEN }}
        run: |
          python clean.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-clean dead/expired sharing links [skip ci]" && git push)
